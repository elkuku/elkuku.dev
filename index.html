<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>elkuku.dev</title>
    <meta name="description" content="elkuku aka Nikolai Plath – projects hosted on elkuku.dev">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="img/icons8-kermit-the-frog-color-120.png">
    <style>
        :root {
            --bg: #f5f7f4;
            --surface: #ffffff;
            --text: #1d2420;
            --muted: #5d6862;
            --border: #dfe5e0;
            --accent: #2f9e44;
            --accent-soft: #e6f4e9;
            --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 8px 24px rgb(0 0 0 / .06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111513;
                --surface: #1a201c;
                --text: #e8ece9;
                --muted: #9aa69f;
                --border: #2a332e;
                --accent: #7ee08f;
                --accent-soft: #1f3324;
                --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25);
            }
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 56rem;
            margin: 0 auto;
            padding: clamp(2.5rem, 8vw, 5rem) 1rem 3rem;
        }

        header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: clamp(2.5rem, 6vw, 4rem);
        }

        header img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 3rem);
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        h1 span { color: var(--accent); }

        .tagline {
            margin: .35rem 0 0;
            color: var(--muted);
            font-size: 1.05rem;
        }

        h2 {
            margin: 0 0 1rem;
            font-size: .8rem;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .grid {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
            gap: .875rem;
        }

        .card {
            display: flex;
            flex-direction: column;
            gap: .2rem;
            height: 100%;
            padding: 1.1rem 1.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            color: inherit;
            text-decoration: none;
            transition: transform .15s ease, border-color .15s ease;
        }

        .card:hover, .card:focus-visible {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .card strong {
            font-size: 1.05rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: .5rem;
        }

        .card strong::after {
            content: "→";
            color: var(--accent);
            transition: transform .15s ease;
        }

        .card:hover strong::after { transform: translateX(3px); }

        .card .host {
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: .82rem;
            color: var(--muted);
            overflow-wrap: anywhere;
        }

        section + section { margin-top: 2.5rem; }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: .6rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .links a {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            padding: .5rem .95rem;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
        }

        .links a:hover { outline: 1px solid var(--accent); }

        .links svg { width: 1.1em; height: 1.1em; fill: currentColor; }

        footer {
            padding: 1.5rem 1rem 2rem;
            text-align: center;
            font-size: .85rem;
            color: var(--muted);
        }

        @media (max-width: 30rem) {
            header { flex-direction: column; align-items: flex-start; gap: 1rem; }
            header img { width: 80px; height: 80px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .card, .card strong::after { transition: none; }
            .card:hover { transform: none; }
        }
    </style>
</head>
<body>
<main>
    <header>
        <img src="img/elkuku.jpeg" alt="elkuku avatar" width="96" height="96">
        <div>
            <h1>elkuku<span>.dev</span></h1>
            <p class="tagline">aka Nikolai Plath</p>
        </div>
    </header>

    <section>
        <h2>Projects</h2>
        <ul class="grid">
            <li><a class="card" href="https://4e-ecuador.elkuku.dev/"><strong>4E</strong><span class="host">4e-ecuador.elkuku.dev</span></a></li>
            <li><a class="card" href="https://agent-tools.elkuku.dev/"><strong>AgentTools</strong><span class="host">agent-tools.elkuku.dev</span></a></li>
            <li><a class="card" href="https://atacames.elkuku.dev/"><strong>Atacames, Ecuador</strong><span class="host">atacames.elkuku.dev</span></a></li>
            <li><a class="card" href="https://kgpsdiary.elkuku.dev/"><strong>KGPSDiary</strong><span class="host">kgpsdiary.elkuku.dev</span></a></li>
            <li><a class="card" href="https://maxfielder.elkuku.dev/"><strong>Maxfielder</strong><span class="host">maxfielder.elkuku.dev</span></a></li>
            <li><a class="card" href="https://minicc.elkuku.dev/"><strong>MiniCC</strong><span class="host">minicc.elkuku.dev</span></a></li>
        </ul>
    </section>

    <section>
        <h2>Elsewhere</h2>
        <ul class="links">
            <li>
                <a href="https://github.com/elkuku">

                    elkuku@github
                </a>
            </li>
        </ul>
    </section>
</main>
<footer>elkuku.dev</footer>
</body>
</html>
